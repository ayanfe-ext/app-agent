name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Agent Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            app/agent.py \
            app/config.py \
            app/llm_provider.py \
            app/main.py \
            app/memory.py \
            app/observability.py \
            app/prompts.py \
            app/routes.py \
            app/schemas.py \
            app/tools.py \
            tests/conftest.py \
            tests/test_agent.py \
            tests/test_main.py \
            tests/test_tools.py

      - name: Run tests
        run: python -m pytest -q
